name: Clock-out Reminders

# Reminders are triggered every 5 minutes by cron-job.org. GitHub's own
# schedule ran too irregularly, so this is kept only for manual checks.
on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder check
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/reminders"
